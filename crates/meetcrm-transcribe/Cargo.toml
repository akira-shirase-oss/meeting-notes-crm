[package]
name = "meetcrm-transcribe"
description = "The transcription port, the transcript importer, the hosted (Deepgram) adapter and the recorded adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hex.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
hyper = { workspace = true, features = ["client", "server"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio", "server"] }
tokio = { workspace = true, features = ["fs", "test-util"] }

[lints]
workspace = true
